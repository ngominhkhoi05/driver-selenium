# JUnit 5 Platform configuration.
# File này nằm trong classpath test → tự động được JUnit load khi chạy test.
#
# EnvironmentWriter là một @BeforeAllCallback, được JUnit gọi tự động khi test
# bắt đầu → không cần đăng ký qua SPI. Chỉ cần class này nằm trong classpath test
# (đã có vì src/test/java/.../tests/hooks/EnvironmentWriter.java).
#
# Các extension khác (nếu có) có thể đăng ký qua SPI file:
#   src/test/resources/META-INF/services/org.junit.jupiter.api.extension.Extension
junit.jupiter.extensions.autodetection.enabled=true
